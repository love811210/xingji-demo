function starfield(radius, count, r) {

function lumpyRock(seed) { // a boulder: a smooth sphere pushed into lumps, the same wherever it is used
  const g = new THREE.SphereGeometry(1, 18, 12), p = g.attributes.position, r = mulberry(seed), ph = [r() * 9, r() * 9, r() * 9, r() * 9, r() * 9];

function drawFlagChip(c) { // the mothership's plate: hull, shield, speed. In the tactical view a tap selects the mothership
  const f = state.flag, { x, y, w } = c, tap = c.kind === 'tap';
  ctx.save();
  const on = touchPlate(c, 12, c.active);
  ctx.strokeStyle = c.active ? C.lime : tap ? 'rgba(111,227,255,0.55)' : ACCENT; ctx.lineWidth = c.active || on ? 3 : 1.5; if (!tap) ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]); // dotted: a read-out, not a button
  text('母艦', x + 10, y + 24, tune.touch_text, c.active ? C.lime : C.white, 'left', 'bold');
  if (f.dead) { text('已被擊毀', x + w / 2, y + 62, tune.touch_small, C.red, 'center', 'bold'); ctx.restore(); return; }
  text(`${Math.ceil(f.hp)}`, x + w - 10, y + 24, tune.touch_text, hpColor(f.hp / f.max), 'right', 'bold');
  bar(x + 10, y + 42, w - 20, 9, f.hp / f.max, hpColor(f.hp / f.max));
  if (f.shieldT > 0) bar(x + 10, y + 54, w - 20, 6, f.shieldT / tune.shield_time, C.shield); else bar(x + 10, y + 54, w - 20, 6, 1 - f.shieldCd / tune.shield_cd, f.shieldCd > 0 ? C.grey : 'rgba(127,232,255,0.6)');
  const mode = state.rush > 0.25 ? '彈弓加速' : f.auto ? '自動駕駛' : f.hover ? '懸停' : `${(f.vel.length() / 100).toFixed(2)} km/s`;
  textFit(mode, x + 10, y + 74, tune.touch_small, f.auto || f.hover ? C.line : C.white, 'left', 'bold', w - 20);
  ctx.restore();
}
function drawStick() {
  const R = tune.touch_stick_r, on = stick.id !== null, cx = on ? stick.ox : tune.touch_stick_x, cy = on ? stick.oy : tune.touch_stick_y;
  ctx.save(); ctx.globalAlpha *= on ? 0.95 : 0.7;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = 'rgba(10,22,40,0.5)'; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = 'rgba(111,227,255,0.7)';
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2, px = cx + Math.cos(a) * R * 0.8, py = cy + Math.sin(a) * R * 0.8; ctx.beginPath(); ctx.moveTo(px + Math.cos(a) * 10, py + Math.sin(a) * 10); ctx.lineTo(px + Math.cos(a + 2.2) * 9, py + Math.sin(a + 2.2) * 9); ctx.lineTo(px + Math.cos(a - 2.2) * 9, py + Math.sin(a - 2.2) * 9); ctx.closePath(); ctx.fill(); }
  ctx.beginPath(); ctx.arc(cx + stick.kx * R, cy + stick.ky * R, R * 0.42, 0, Math.PI * 2); ctx.fillStyle = on ? 'rgba(111,227,255,0.6)' : 'rgba(111,227,255,0.25)'; ctx.fill(); ctx.strokeStyle = C.white; ctx.lineWidth = 2; ctx.stroke();
  if (!on) text('轉向', cx, cy + 1, tune.touch_text, C.white, 'center', 'bold');
  ctx.restore();
}
function drawTouch() { // on top of everything, never faded with the view
  ctx.save(); ctx.globalAlpha = 1;
  for (const c of touchControls()) {
    if (c.hidden) continue;
    if (c.kind === 'stick') drawStick();
    else if (c.chip === 'squad') drawSquadChip(c);
    else if (c.chip === 'flag') drawFlagChip(c);
    else drawTouchButton(c);
  }
  ctx.restore();
}
function drawReportTouch() { // the report for a phone: the verdict, the losses and the buttons, large; the fine-grained tables are left to the desktop
  const R = state.report, S = state.stats, x = 100, y = 16, w = 1080, h = 688, tx = x + 40, mw = w - 80;
  ctx.fillStyle = 'rgba(4,8,16,0.6)'; ctx.fillRect(0, 0, W, H);
  const accent = R.kind === 'win' ? C.lime : R.kind === 'retreat' ? C.orange : C.red;
  panel(x, y, w, h, accent, 20);
  text('戰報', tx, y + 34, 20, C.mute, 'left', 'bold'); text(`第 ${state.attempt} 次出擊`, x + w - 40, y + 34, 20, C.mute, 'right', 'bold');
  textFit(R.kind === 'win' ? `勝利：摧毀${ENEMY}星港，取得軌道控制` : R.kind === 'retreat' ? '撤退：任務未完成' : '失敗：全軍覆沒', tx, y + 80, 38, accent, 'left', 'bold', mw);
  textFit(`戰鬥時間 ${Math.floor(R.time / 60)}:${String(Math.floor(R.time % 60)).padStart(2, '0')} · 母艦船體 ${Math.round(R.flagHp * 100)}%${state.flag.dead ? '（被擊毀）' : ''}`, tx, y + 126, 24, C.white, 'left', '', mw);
  const cols = [['出擊', C.white], ['完好', C.lime], ['受損可修', C.yellow], ['重創回收', C.orange], ['永久損失', C.red]], ty = y + 172, c0 = tx + 300, cp = 172;
  text('艦艇', tx, ty, 22, C.mute, 'left', 'bold');
  cols.forEach(([n, c], i) => text(n, c0 + i * cp, ty, 22, c, 'center', 'bold'));
  const rp = 44;
  R.rows.forEach((r, j) => {
    const yy = ty + 42 + j * rp;
    if (!shipIcon(topFile('f', r.cls), tx + 14, yy, 34, 0, C.line) && !classIcon(r.cls, tx + 14, yy, 34, C.line)) mark(r.cls, tx + 14, yy, 0, C.line, 1);
    text(r.name, tx + 42, yy, 26, C.white, 'left', 'bold');
    [r.n, r.ok, r.dmg, r.rec, r.lost].forEach((v, i) => text(`${v}`, c0 + i * cp, yy, 28, v || i === 0 ? cols[i][1] : C.grey, 'center', 'bold'));
  });
  let ly = ty + 42 + R.rows.length * rp + 8;
  if (R.kind !== 'win') { textFit('沒打贏時，失去動力的艦艇沒人回收，算永久損失', tx, ly, 22, C.orange, 'left', '', mw); ly += 36; }
  const K = c => S.kills[c] || 0, D = state.defTotal, fleetDmg = S.dealt.esc + S.dealt.cru + S.dealt.bom + S.dealt.sct;
  textFit(`守方損失：砲塔 ${K('tur')}/${D.tur} · 無人機巢 ${K('hive')}/${D.hive} · 護盾站 ${K('shd')}/${D.shd} · 防守艦艇 ${K('esc') + K('cru') + K('bom')}/${D.ships} · 無人機 ${K('fig')}`, tx, ly, 22, C.white, 'left', '', mw); ly += 34;
  textFit(`輸出：母艦 ${Math.round(S.dealt.flag)} · 分隊 ${Math.round(fleetDmg)} · 護盾擋下 ${Math.round(S.absorbed)} · 撞擊 ${S.crashes} 次`, tx, ly, 22, C.mute, 'left', '', mw);
  if (state.finishing) text(R.kind === 'win' ? '任務完成' : '正在結算', x + w / 2, tune.touch_report_y + tune.touch_dialog_h / 2, 34, accent, 'center', 'bold');
}

// ---- Scenes --------------------------------------------------------------------------------------
function playInput(dt) {
  if (pressed('Tab') && !state.flag.dead) { if (state.view === 'tac') { leaveTac(); sfx.view(false); } else { enterTac(); sfx.view(true); } }
  if (pressed('KeyR')) { if (state.retreat > 0) { state.retreat = 0; banner('取消撤退', '', C.line, 1.2); } else { state.retreat = tune.retreat_time; banner('撤退準備中', `${tune.retreat_time} 秒後跳離戰場`, C.orange, 1.6); } sfx.order(); }
  if (pressed('Slash') || pressed('F1')) state.help = state.help > 0 ? 0 : 9999; // the controls list, on demand
  ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].forEach((c, i) => {
    if (!pressed(c)) return;
    if (squads[i] && !squads[i].absent) { state.sel = [i]; state.selFlag = false; sfx.order(); }
    else { banner('沒有這個分隊', `艦隊裡沒有${squads[i] ? squads[i].name : '這一隊'}`, C.yellow, 1.2); sfx.bad(); }
  });
  if (pressed('Digit6')) { state.sel = presentSquads(); state.selFlag = false; sfx.order(); }
  if (pressed('KeyQ')) state.sel.forEach(i => useSkill(i, 0));
  if (pressed('KeyE')) state.sel.forEach(i => useSkill(i, 1));
  if (pressed('KeyX')) orderSquads(state.sel, 'hold');
  if (pressed('KeyG')) orderSquads(state.sel, 'follow');
  if (!state.flag.dead) {
    if (pressed('KeyH')) flagHover();
    if (pressed('KeyT')) flagShield();
    if (pressed('KeyZ')) flagMissiles();
  }
  if (state.view === 'pilot') {
    if (pressed('KeyF')) pilotAttack();
    if (pressed('KeyJ')) { avoidOn = !avoidOn; events.push({ t: state.t, type: 'avoid', on: avoidOn }); banner(avoidOn ? '自動避障：開' : '自動避障：關', avoidOn ? '前方會撞上時自動繞開' : '撞不撞全看你自己', avoidOn ? C.line : C.orange, 1.4); sfx.order(); }
    if (pressed('KeyK')) { gravComp = !gravComp; events.push({ t: state.t, type: 'gravcomp', on: gravComp }); banner(gravComp ? '引力補償：開' : '引力補償：關', gravComp ? '飛控抵銷引力：不會被拉走，也借不到彈弓' : '引力會拉你，也能借衛星彈弓加速', gravComp ? C.orange : C.line, 1.8); sfx.order(); }
    if (pressed('KeyB')) { cam3 = !cam3; events.push({ t: state.t, type: 'camera', third: cam3 }); banner(cam3 ? '第三人稱視角' : seatName() + '視角', T('B 切換', ''), C.line, 1); sfx.order(); }
    state.look = held('KeyV');
    pointer.clicks.length = 0; pointer.wheel = 0; pointer.panX = pointer.panY = 0; pointer.zoom = 1;
  } else {
    state.look = false;
    if (pressed('KeyF')) orderSquads(state.sel, 'assault');
    if (pressed('Digit0') && !state.flag.dead) { state.selFlag = true; state.sel = []; sfx.order(); }
    const k = state.tac.h / tune.tac_height * tune.tac_pan_speed * dt;
    state.tac.x += ((held('ArrowRight', 'KeyD') ? 1 : 0) - (held('ArrowLeft', 'KeyA') ? 1 : 0)) * k;
    state.tac.z += ((held('ArrowDown', 'KeyS') ? 1 : 0) - (held('ArrowUp', 'KeyW') ? 1 : 0)) * k;
    if (held('Equal', 'NumpadAdd')) pointer.wheel -= dt * 4;
    if (held('Minus', 'NumpadSubtract')) pointer.wheel += dt * 4;
    state.tac.h = Math.max(tune.tac_zoom_min, Math.min(tune.tac_zoom_max, state.tac.h * (1 + pointer.wheel * 0.1))); pointer.wheel = 0;
    if (TOUCH) { // touch pass: two fingers pinch the height, one finger drags the map (the ground follows the finger)
      state.tac.h = Math.max(tune.tac_zoom_min, Math.min(tune.tac_zoom_max, state.tac.h * pointer.zoom));
      const kx = 2 * Math.tan(25 * Math.PI / 180) * Math.hypot(1, 0.4) * state.tac.h / H, lim = tune.field_radius; // world units per stage px at the middle of the map (camTac: 50 degrees, tilted by 0.4)
      state.tac.x = Math.max(-lim, Math.min(lim, state.tac.x - pointer.panX * kx)); state.tac.z = Math.max(-lim, Math.min(lim, state.tac.z - pointer.panY * kx * Math.hypot(1, 0.4)));
      pointer.panX = pointer.panY = 0; pointer.zoom = 1;
    }
    if (pointer.clicks.length) { placeCamera(); for (const c of pointer.clicks) tacClick(c.x, c.y); pointer.clicks.length = 0; }
  }
}
const scenes = {
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      state.t += dt; sfxGate -= dt; state.edgeWarn -= dt; state.backWarn -= dt;
      if (state.help > 0 && state.help < 9000) state.help -= dt;
      if (state.banner) { state.banner.t += dt; if (state.banner.t > state.banner.dur) state.banner = null; }
      if (state.ping) state.ping.t += dt;
      state.shake = Math.max(0, state.shake - dt); state.flash = Math.max(0, state.flash - dt * 1.2);
      if (!state.over) playInput(dt); else { pointer.clicks.length = 0; state.look = false; }
      const goal = state.view === 'tac' ? 1 : 0;
      state.viewT += Math.sign(goal - state.viewT) * Math.min(Math.abs(goal - state.viewT), dt / tune.view_blend);
      const e = ease(state.viewT);
      if (e > 0.5) state.stats.tactical += dt; else state.stats.pilot += dt;
      const bdt = dt * (1 + (tune.tac_slow - 1) * e);
      if (state.retreat > 0 && !state.over) { state.retreat -= bdt; if (state.retreat <= 0) { state.retreat = 0; endBattle('retreat'); } }
      stepBattle(bdt);
      objectiveNow();
      if (state.over) {
        state.over.t += dt;
        if (state.over.t > 3) { buildReport(); state.view = 'tac'; scene = 'results'; if (!state.stats.switches) tacFocus(); }
      }
    },
    draw: drawPlay,
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() {
      if (TOUCH) { renderWorld(); clear(); const e = ease(state.viewT); if (e < 1) { ctx.globalAlpha = 1 - e; drawCockpitHud(); ctx.globalAlpha = 1; } if (e > 0) { ctx.globalAlpha = e; drawTacHud(); ctx.globalAlpha = 1; } drawOverlays(); ctx.fillStyle = 'rgba(4,8,16,0.6)'; ctx.fillRect(0, 0, W, H); text('暫停', W / 2, H / 2 - 50, 56, C.white, 'center', 'bold'); drawTouch(); return; } // touch pass: the play controls are not drawn under the veil; 繼續 is a button
      drawPlay(); ctx.fillStyle = 'rgba(4,8,16,0.5)'; ctx.fillRect(0, 0, W, H); text('暫停', W / 2, H / 2, 48, C.white, 'center', 'bold'); text('P 繼續', W / 2, H / 2 + 50, 18, C.mute);
    },
  },
  results: {
    update(dt) {
      state.t += dt; state.viewT = Math.min(1, state.viewT + dt / tune.view_blend);
      stepFx(dt);
      reportInput(dt);
    },
    draw() { renderWorld(); clear(); drawReport(); if (TOUCH) drawTouch(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (TOUCH) touchSweep();
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

function hexRgb(h) { const n = parseInt(String(h).replace('#', ''), 16); return Number.isFinite(n) ? `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}` : '56,255,138'; }
SLICE.start('battle', st => {
  START = st;
  // the mothership style
  try {
    const h = SLICE.hull;
    HULL_ID = h.id; HULL_NAME = h.name; HULL_ROLE = h.role; ACCENT = h.accent; LED_RGB = hexRgb(h.accent); C.led = h.accent;
    for (const k of Object.keys(MOD)) { const v = Number(SLICE.mod(k)); MOD[k] = Number.isFinite(v) && v > 0 ? v : 1; }
  } catch (err) { console.warn('[battle] hull style unavailable, using defaults', err); }
  // the fleet the base phase built: 0..6 per squad, never an empty fleet
  if (st.target && st.target.name) { ENEMY = String(st.target.name); LEVEL = Math.max(1, Math.min(9, Math.floor(Number(st.target.level) || 1))); }
  LOOP = !!st.loop; CLS.sta.name = ENEMY + '星港'; document.title = '星際 · 攻打' + ENEMY;
  { // art pass: the painted picture of the world under attack (the shell passes target.id; standalone it is 赤環)
    const id = st.target && typeof st.target.id === 'string' && CONFIG['disc_' + st.target.id] ? st.target.id : 'chihuan';
    loadPlanetArt(id);
    loadCard('ship-flag-' + HULL_ID); // art pass 2: the chosen mothership's painted rear view, for the third-person camera
  }
  const fl = st.fleet || {}, cl = v => Math.max(0, Math.min(6, Math.floor(Number(v) || 0)));
  FLEET = { esc: cl(fl.frigate), cru: cl(fl.cruiser), bom: cl(fl.bombard), sct: cl(fl.scout), sup: cl(fl.support) };
  if (FLEET.esc + FLEET.cru + FLEET.bom === 0) FLEET.esc = 1;
  reset(); scene = 'play';
  last = clock.now();
  if (params.get('manual') === '1') drawFrame();
  else { requestAnimationFrame(frame); setInterval(timer, 50); }
});
</script>
