<script>
'use strict';
// ---- Config: every number and table the shell uses ------------------------------------------------------
const CFG = {
  stageW: 1280, stageH: 748, fadeMs: 400,
  warpSeconds: 3.2,                       // the jump between the map and a mission
  saveKey: 'xingji-slice-v2', baseKey: 'xingji-slice-v2-base',
  scoreExplore: 50, scoreRevisit: 10, scoreWin: 100,   // 星域積分: first survey, a repeat survey, a raid won (x defence level)
  ranks: [[0, '見習艦長'], [100, '艦長'], [300, '分艦隊指揮'], [700, '星域指揮官'], [1500, '星域元帥']],
  // what a raid brings home, per defence level L: base + per * L
  loot: { steel: [20, 10], circuit: [4, 2], battery: [3, 2], hull: [1, 1], thruster: [0, 1], avionics: [0, 1] },
  revisit: { steel: 10, copper: 10 },     // a second survey of a planet that already has an outpost
  starter: { frigate: 3, cruiser: 2, bombard: 1, scout: 1, support: 1 },   // 基礎艦隊: what 「跳過基建」 and 「補給基礎艦隊」 top the fleet up to. Free and unlimited, so a raid can always be flown again
  starterReveals: 'chihuan',              // skipping the base also puts the first home on the map, so there is something to raid at once
  art: 'assets/img/',                     // web-sized JPEGs made by assets/optimize.ps1 from the masters in assets/gen/
};
// The star system. kind: home (your base) / wild (survey it, plant an outpost) / enemy (another player's home world, offline).
// reveals: what a first survey or a first win puts on the map. type: the planet phase's terrain type.
const NODES = [
  { id: 'huiji', name: '灰脊', kind: 'home', type: 'rocky', x: 190, y: 400, s: 170, known: true, line: '陸地 · 岩石 · 核心安全區',
    desc: '你的基地所在。礦場和產線不會停，出門時它照常生產；回來補艦、擴產線。' },
  { id: 'qianlan', name: '淺瀾', kind: 'wild', type: 'ocean', x: 430, y: 190, s: 120, known: true, seed: 31, line: '液體 · 海洋 · 邊境擴張區', from: 'huiji',

  return { seed: n.seed || S.seed, hull: S.hull, loop: true, fleet: S.fleet, target: { id: n.id, name: n.name, type: n.type, home: n.kind === 'home', level: st.level || 1 } };
}
addEventListener('message', ev => {
  const m = ev.data; if (!m || m.src !== 'xj') return;
  const fromBase = ev.source === fBase.contentWindow, fromAct = ev.source === fAct.contentWindow;
  if (!fromBase && !fromAct) return;
  if (m.type === 'ready') {
    if (fromAct && !act) return;
    ev.source.postMessage({ src: 'xj', type: 'init', state: JSON.parse(JSON.stringify(initFor(fromBase))) }, '*');
    if (fromBase) { baseReady = true; const q = baseQueue; baseQueue = []; sendBase({ type: 'background', on: where !== 'base' }); if (S.homeDone) sendBase({ type: 'set_fleet', fleet: S.fleet }); q.forEach(sendBase); }
    return;
  }
  if (m.type === 'objective') { const o = { text: m.text || '', step: m.step, of: m.of }; if (fromBase) objBase = o; else objAct = o; drawBar(); }
  else if (m.type === 'toast') toast(m.text);
  else if (fromBase && m.type === 'fleet') {
    S.fleet = Object.assign({ frigate: 0, cruiser: 0, bombard: 0, scout: 0, support: 0 }, m.fleet); save(); drawBar();
    if (where !== 'base' && m.built) toast('基地回報：' + ((SHIPS.find(([k]) => k === m.built) || [])[1] || '戰艦') + '出廠');
  }
  else if (fromBase && m.type === 'open_map') openMap();
  else if (fromBase && m.type === 'base_save') { try { localStorage.setItem(CFG.baseKey, JSON.stringify(m.save)); } catch (e) {} }
  else if (fromAct && m.type === 'phase_done' && act) missionDone(m.phase, m.result || {});
});
$('view').addEventListener('pointerdown', () => { const f = where === 'base' ? fBase : where === 'act' ? fAct : null; if (f && f.contentWindow) f.contentWindow.focus(); });

// ---- The star map ------------------------------------------------------------------------------------------
function openMap() { fade(() => { where = 'map'; buildMap(); layout(); if (!S.mapSeen) { S.mapSeen = true; save(); } }); }
function suggest() { // where the adviser points when the map opens
  const st = S.nodes, foe = NODES.filter(n => n.kind === 'enemy' && st[n.id].known).sort((a, b) => st[a.id].level - st[b.id].level)[0];
  const wild = NODES.find(n => n.kind === 'wild' && st[n.id].known && !st[n.id].done);
  if (fleetN() === 0) return wild && !foe ? wild.id : 'huiji';
  return foe ? foe.id : wild ? wild.id : 'huiji';
}
function buildMap() {
  $('sMap').style.backgroundImage = 'url(' + art('starmap-bg') + ')';
  const st = S.nodes, box = $('nodes'); box.innerHTML = '';
  let lines = '';
  for (const n of NODES) {
    if (!st[n.id].known) continue;
    if (n.from && st[n.from] && st[n.from].known) { const a = nodeDef(n.from); lines += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + n.x + '" y2="' + n.y + '" stroke="' + (n.kind === 'enemy' ? '#ff3d5a' : '#6fe3ff') + '" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>'; }
    const d = document.createElement('div'), lv = st[n.id].level;
    d.className = 'node ' + n.kind + (st[n.id].fresh ? ' new' : ''); d.dataset.id = n.id; d.style.left = n.x + 'px'; d.style.top = (n.y - n.s / 2) + 'px';
    const status = n.kind === 'home' ? '基地 · 生產中' : n.kind === 'wild' ? (st[n.id].done ? '前哨運作中' : '未探索') : '防禦等級 ' + lv + (st[n.id].done ? ' · 已攻下 ' + st[n.id].done + ' 次' : '');
    d.innerHTML = '<div class="ring" style="width:' + (n.s + 14) + 'px;height:' + (n.s + 14) + 'px;margin-left:' + (-(n.s + 14) / 2 - 2) + 'px;top:-9px"></div>' +
      '<img class="pl" src="' + art('planet-' + n.id) + '" width="' + n.s + '" height="' + n.s + '" alt="">' +
      '<div class="nm">' + n.name + '</div><span class="st">' + status + '</span>';
    d.onclick = () => pick(n.id); box.appendChild(d);
  }
  $('mapLines').innerHTML = lines;
  const known = NODES.filter(n => st[n.id].known).length;
  $('mapSub').textContent = '已知 ' + known + ' 處 · 探索 ' + S.stats.surveys + ' 次 · 出征 ' + S.stats.raids + ' 次，勝 ' + S.stats.wins + ' 次';
  pick(st[selNode] && st[selNode].known && selNode !== 'huiji' ? selNode : suggest());
}
function lootFor(L) { const o = {}; for (const k of Object.keys(CFG.loot)) o[k] = CFG.loot[k][0] + CFG.loot[k][1] * L; return o; }
function pick(id) {
  selNode = id; const n = nodeDef(id), st = S.nodes[id];
  if (st.fresh) { st.fresh = false; save(); }
  document.querySelectorAll('.node').forEach(e => { e.classList.toggle('sel', e.dataset.id === id); if (e.dataset.id === id) e.classList.remove('new'); });
  const f = S.fleet, total = fleetN(); let who, say, rows = '', btn = '', why = '';
  if (n.kind === 'home') {
    who = WHO.ju; say = total ? '產線我顧著。船不夠就回來補，別硬撐。' : '還沒有戰艦。回基地把產線接到船塢，或先領一支基礎艦隊。';
    rows = SHIPS.map(([k, n]) => '<span>' + n + '</span><b>' + (f[k] || 0) + '</b>').join('');
    btn = '<button class="btn sm" id="pGo">回基地</button>';
  } else if (n.kind === 'wild') {
    who = WHO.ting; say = st.done ? '這裡的前哨運作正常。想再看一次風景也行，順手帶一點補給回去。' : '還沒有人掃描過這裡！飛過去看看，找到礦點就能設前哨。';
    const g = st.done ? CFG.revisit : n.gift;
    rows = '<span>行星類型</span><b>' + n.line.split(' · ')[1] + '</b><span>' + (st.done ? '順路補給' : '前哨補給') + '</span><b>' + Object.keys(g).map(k => ITEM_NAME[k] + ' ' + g[k]).join('<br>') + '</b><span>星域積分</span><b>+' + (st.done ? CFG.scoreRevisit : CFG.scoreExplore) + '</b>';
    btn = '<button class="btn sm" id="pGo">' + (st.done ? '再去看看' : '前往探索') + '</button>';
  } else {
    who = WHO.zhen; const L = st.level, loot = lootFor(L);
    say = total === 0 ? '一艘戰艦都沒有，去了只是送母艦。先補給一支基礎艦隊，或回基地造艦。' : total < 4 ? '這點船打得很吃力。先引開防守艦隊，轟擊艦留在砲塔射程外。' : '艦隊夠看了。先打護盾站，再拆砲塔，最後才是星港。';
    rows = '<span>防禦等級</span><b>' + L + '</b><span>你的艦隊</span><b>' + total + ' 艘</b><span>戰利品</span><b>' + Object.keys(loot).filter(k => loot[k]).map(k => ITEM_NAME[k] + ' ' + loot[k]).join('<br>') + '</b><span>星域積分</span><b>+' + CFG.scoreWin * L + '</b>';
    if (total === 0) { why = '需要至少 1 艘戰艦'; btn = '<button class="btn sm" id="pGo">補給基礎艦隊</button>'; } else btn = '<button class="btn sm" id="pGo">出征</button>';
  }
  $('panel').innerHTML = '<div class="who"><img src="' + art(who[1]) + '" alt=""><div class="say"><b>' + who[0] + '</b>' + say + '</div></div>' +
    '<h3><span>' + n.name + '</span></h3><div class="kind">' + n.line + '</div><div class="desc">' + n.desc + '</div><div class="rows">' + rows + '</div><div class="grow"></div>' +
    (why ? '<div class="why">' + why + '</div>' : '') + btn;
  $('pGo').onclick = () => {
    if (n.kind === 'home') fade(() => { where = 'base'; layout(); });
    else if (n.kind === 'wild') travel(n, '躍遷引擎啟動', '前往' + n.name + ' · ' + n.line.split(' · ')[1]);
    else if (fleetN() > 0) travel(n, '艦隊出征', '目標：' + n.name + ' · 防禦等級 ' + st.level);
    else { supply(false); pick(id); }
  };
}

// ---- Travel: a short jump, then the mission ---------------------------------------------------------------
let warp = null;
function travel(node, cap, sub) {
  if (busy) return;
  fade(() => {
    where = 'warp'; $('sWarp').style.backgroundImage = 'url(' + art('sky-nebula') + ')'; $('warpCap').textContent = cap; $('warpSub').textContent = sub;
    warp = { t: 0, tint: node.kind === 'enemy' ? '#ff5a4a' : node.kind === 'wild' ? '#6fe3ff' : XJ_HULLS.get(S.hull).accent, stars: Array.from({ length: 260 }, (_, i) => { const r = mulberry(i + 5); return { a: r() * 6.283, d: r(), s: 0.4 + r() }; }) };
    startAct(node.kind === 'enemy' ? 'battle' : 'planet', node); // the mission loads behind the jump
    layout();
  });
}
function drawWarp(dt) {
  if (!warp) return;
  warp.t += dt; const x = $('warpCv').getContext('2d'), t = warp.t, k = Math.min(1, t / 1.0), end = Math.max(0, (t - (CFG.warpSeconds - 1)) / 1);
  x.clearRect(0, 0, 1280, 720); x.fillStyle = 'rgba(5,9,18,' + (0.25 + 0.3 * k) + ')'; x.fillRect(0, 0, 1280, 720); // the painted sky shows through, dimmer as the jump builds
  const cx = 640, cy = 340, acc = XJ_HULLS.get(S.hull).accent;
  for (const s of warp.stars) {
    s.d += dt * (0.1 + 1.3 * k * (1 - end * 0.9)) * s.s; if (s.d > 1) s.d = 0.02;
    const r0 = s.d * s.d * 900, r1 = Math.max(0, (s.d - 0.05 * k * (1 - end)) ** 2 * 900);
    x.strokeStyle = s.s > 1.1 ? acc : '#cfe0ff'; x.globalAlpha = Math.min(1, s.d * 1.4); x.lineWidth = 1 + s.d * 2;
    x.beginPath(); x.moveTo(cx + Math.cos(s.a) * r1, cy + Math.sin(s.a) * r1 * 0.62); x.lineTo(cx + Math.cos(s.a) * r0, cy + Math.sin(s.a) * r0 * 0.62); x.stroke();
  }
  x.globalAlpha = 1;
  if (end > 0) { const r = 20 + end * 120, g = x.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6); g.addColorStop(0, warp.tint); g.addColorStop(1, 'rgba(0,0,0,0)'); x.globalAlpha = 0.85; x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r * 1.6, 0, 6.283); x.fill(); x.globalAlpha = 1; }
  if (t > CFG.warpSeconds && !busy) { warp = null; fade(() => { where = 'act'; layout(); }); }
}

// ---- A mission comes back -----------------------------------------------------------------------------------
function missionDone(phase, res) {
  const n = nodeDef(act.node), st = S.nodes[n.id]; stopAct();
  if (phase === 'planet' && n.kind === 'home') { // the first landing: the base begins
    S.homeDone = true; st.done = 1; save();
    fade(() => { startBase(); where = 'base'; layout(); });
    return;
  }
  let card;
  if (phase === 'planet') {
    const first = !st.done, gift = first ? n.gift : CFG.revisit, found = res.planet && res.planet.found ? Object.values(res.planet.found).reduce((a, c) => a + c, 0) : 0, pts = first ? CFG.scoreExplore : CFG.scoreRevisit;
    st.done++; S.stats.surveys++; S.score += pts; sendBase({ type: 'grant', items: gift, note: n.name + '前哨的補給到了' });
    let reveal = null; if (first && n.reveals && !S.nodes[n.reveals].known) { S.nodes[n.reveals].known = true; S.nodes[n.reveals].fresh = true; reveal = nodeDef(n.reveals); selNode = reveal.id; }
    card = { who: WHO.ting, step: '探索回報', title: first ? '前哨已設立' : '再訪' + n.name, bad: false,
      lead: first ? n.name + '的採集前哨開始運作，第一批補給已經送回灰脊基地。' : '前哨一切正常，順路帶了一點補給回去。',
      grid: [[found, '掃描到的地點'], ['+' + pts, '星域積分']].concat(Object.keys(gift).map(k => ['+' + gift[k], ITEM_NAME[k]])),
      reveal: reveal ? { img: 'planet-' + reveal.id, text: '掃描到家園訊號：<i>' + reveal.name + '</i>。星圖上多了一個可以出征的目標。' } : null,
      btns: [['回星圖', 'map', true], ['回基地', 'base', false]] };
  } else {
    const b = res.battle || {}, win = !!b.win, L = st.level || 1, lost = b.lostBy || {}, nLost = fleetN(lost);
    for (const [k] of SHIPS) S.fleet[k] = Math.max(0, (S.fleet[k] || 0) - (lost[k] || 0));
    S.stats.raids++; S.stats.lost += nLost; sendBase({ type: 'set_fleet', fleet: S.fleet }); raidCard = true;
    if (win) {
      const loot = lootFor(L), pts = CFG.scoreWin * L; S.stats.wins++; S.score += pts; st.done++; st.level = Math.min(9, L + 1);
      sendBase({ type: 'grant', items: loot, note: n.name + '的戰利品入庫' });
      let reveal = null; if (st.done === 1 && n.firstWin && !S.nodes[n.firstWin].known) { S.nodes[n.firstWin].known = true; S.nodes[n.firstWin].fresh = true; reveal = nodeDef(n.firstWin); }
      card = { who: WHO.zhen, step: '戰報 · 防禦等級 ' + L, title: n.name + '淪陷', bad: false,
        lead: '星港倉庫裡的東西已經運回基地。對方上線後會重建，下次來防禦會升到等級 ' + st.level + '。',
        grid: [['+' + pts, '星域積分'], [nLost, '永久損失艦艇']].concat(Object.keys(loot).filter(k => loot[k]).map(k => ['+' + loot[k], ITEM_NAME[k]])),
        reveal: reveal ? { img: 'planet-' + reveal.id, text: '俘獲的星圖上標著一顆沒人去過的行星：<i>' + reveal.name + '</i>。' } : null,
        btns: [['回基地補艦', 'base', true], ['回星圖', 'map', false]] };
    } else {
      card = { who: WHO.zhen, step: '戰報 · 防禦等級 ' + L, title: '撤退', bad: true,
        lead: nLost ? '這一仗沒拿下' + n.name + '，損失了 ' + nLost + ' 艘。回基地補艦，多帶幾艘轟擊艦再來。' : '這一仗沒拿下' + n.name + '。艦隊都帶回來了，整補後再來。',
        grid: [[nLost, '永久損失艦艇'], [fleetN(), '剩餘戰艦'], [b.structuresDestroyed != null ? b.structuresDestroyed : 0, '擊毀設施']], reveal: null,
        btns: [['回基地補艦', 'base', true], ['回星圖', 'map', false]] };
    }
  }
  save();
  fade(() => { buildMap(); showCard(card); where = 'card'; layout(); });
}
let raidCard = false; // the card on screen reports a raid: it offers the starter fleet again when ships were lost
function showCard(c) {
  const btns = raidCard && needSupply() ? [['補給基礎艦隊，回星圖', 'supply', true]].concat(c.btns.map(b => [b[0], b[1], false])) : c.btns; raidCard = false;
  $('resCard').innerHTML = '<div class="top"><img class="face" src="' + art(c.who[1]) + '" alt=""><div><div class="step">' + c.step + ' · ' + c.who[0] + '</div><h2 class="' + (c.bad ? 'bad' : '') + '"><span>' + c.title + '</span></h2><div class="lead">' + c.lead + '</div></div></div>' +
    '<div id="resGrid">' + c.grid.map(g => '<div><b>' + g[0] + '</b><span>' + g[1] + '</span></div>').join('') + '</div>' +
    (c.reveal ? '<div class="found"><img src="' + art(c.reveal.img) + '" alt=""><span>' + c.reveal.text + '</span></div>' : '') +
    '<div class="btnrow">' + btns.map(b => '<button class="btn sm ' + (b[2] ? '' : 'ghost') + '" data-go="' + b[1] + '">' + b[0] + '</button>').join('') + '</div>';
  $('resCard').querySelectorAll('button').forEach(b => b.onclick = () => { let go = b.dataset.go; fade(() => { if (go === 'supply') { supply(false); go = 'map'; } where = go; if (go === 'map') buildMap(); layout(); }); });
}

// ---- Loop -------------------------------------------------------------------------------------------------
let last = performance.now();
function loop(now) {
  const real = (now - last) / 1000, dt = Math.min(0.1, real); last = now;
  if (where === 'hull' && gl.style.display !== 'none') {
    home.rotation.y += dt * 0.05;
    for (const id of XJ_HULLS.order) {
      const m = hullModels[id], show = id === S.hull; m.visible = show;
      if (show) { m.rotation.y += dt * 0.5; m.position.set(0, 1.25 + Math.sin(now / 900) * 0.12, 0); m.scale.setScalar(0.34 + 0.08 * Math.min(1, hullSwap)); m.rotation.x = 0.18; }
    }
    hullSwap = Math.min(1.5, hullSwap + dt * 3);
    renderer.render(scene, cam);
  }
  drawWarp(Math.min(0.5, real));
  requestAnimationFrame(loop);
}

// a picture that is not there (yet) leaves a gap, never a broken-image mark
document.addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') e.target.style.visibility = 'hidden'; }, true);

// ---- Boot -------------------------------------------------------------------------------------------------
fit();
(function boot() {
  const dev = params.get('dev'); // test starts: ?dev=map (a base and the star map; add &demo=1 for a built base), ?dev=foes (every node known), ?dev=base
  if (dev) {
    wipe(); S = fresh(); const h = params.get('hull'); if (XJ_HULLS.order.includes(h)) S.hull = h;
    S.homeDone = true; S.nodes.huiji.done = 1; if (dev === 'foes') for (const n of NODES) S.nodes[n.id].known = true;
    startBase(); where = dev === 'base' ? 'base' : 'map'; if (where === 'map') buildMap(); layout();
  } else { buildTitle(); where = 'title'; layout(); }
  requestAnimationFrame(loop);
})();
window.__slice = { get S() { return S; }, get where() { return where; }, get act() { return act; }, NODES, pick, travel, openMap, missionDone, fBase, fAct }; // a check can read and drive this
</script>
