    SH.forEach((k, i) => { const S = SHIPS[k], one = SH.length > 5, y = ay + 74 + i * (one ? 34 : SH.length > 3 ? 42 : 62); if (ITEMS[k]) itemIcon(k, ax + 36, y, one ? 10 : 12); if (one) { text(S.name, ax + 64, y, 18, C.white, 'left', 'bold'); text(fitText(S.use, 560, 14), ax + 150, y, 14, C.mute, 'left'); } else { text(S.name, ax + 64, y - 9, 18, C.white, 'left', 'bold'); text(S.use, ax + 64, y + 13, 14, C.mute, 'left'); } // six ships: name and use on one line

  ['建造', '艦隊'].forEach((n, k) => btn(W / 2 - 175 + k * 180, H - 62, 170, 50, n, () => { state.otab = k; sfx.tick(); }, { on: tab === k }));

    text('艦隊出征', W / 2, H / 2 - 20, 64, C.lime, 'center', 'bold'); text(fleetLine(), W / 2, H / 2 + 36, 20, C.white); ctx.globalAlpha = 1;

}
const MOTHER_POS = [-0.6, -2.5, 0.3]; // [screen up, screen left, towards the camera] from the dock: where the mothership rests
// ---- Scenes ----------------------------------------------------------------------------------
function putAt(type, x, y, rot = 0, rec = 0) { // a machine of the stated type with its top-left tile at (x, y), free of charge
  const T = MACH[type], [w0, h0] = T.size, w = rot % 2 ? h0 : w0, h = rot % 2 ? w0 : h0, list = [];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) list.push(at(x + i, y + j));
  return addBuilding(type, { x, y, w, h, list }, rot, rec, true);
}
function seedBase() { // the standing start: four receivers spread the core's power, and the supply stations are already on the pad
  const B = bases[0]; use(B);
  for (const [x, y] of [[21, 15], [27, 15], [21, 31], [27, 31]]) putAt('receiver', x, y).pre = true;
  const pQ = putAt('pad', 18, 12), pC = putAt('pad', 23, 12), pL = putAt('pad', 28, 12), pW = putAt('pipehead', 31, 13); // top row, left to right: quartz, chalcopyrite, lithium, water
  pQ.route = 'quartz1'; pC.route = 'chalco1'; pL.route = 'lith1'; pW.route = 'water1';
  for (const b of [pQ, pC, pL, pW]) b.pre = true;
  rebuildPipes(); topoChanged();
}
// ---- Save: the whole base as plain data, and back (the shell keeps it in localStorage, so a reload carries on) ----
function snapshot() {
  const B = bases[0];
  return { v: 1, stage: state.stage, goal: state.goal, made: state.made, stock: B.stock, elevator: B.elevator, coreLv: B.coreLv,
    fleet: state.fleet, speed: state.speed, launched: !!state.sl.launched, real: state.real,
    ports: B.core.ports.map(q => q.item),
    berths: B.orbit.berths.map(o => ({ ship: o.ship || null, repeat: !!o.repeat })),
    blds: B.blds.filter(b => b.type !== 'core').map(b => ({ t: b.type, x: b.x, y: b.y, r: b.rot, c: b.rec, i: b.item, o: b.route, p: b.pre ? 1 : 0 })),
    belts: B.cells.filter(c => c.belt && !c.belt.exit).map(c => c.belt.link ? [c.i, c.belt.dir, c.belt.link.kind, c.belt.link.to] : [c.i, c.belt.dir]),
    pipes: B.cells.filter(c => c.pipe).map(c => c.i),
    jns: B.cells.filter(c => c.jn).map(c => [c.i, c.jn.type, c.jn.dir, c.jn.item]) };
}
function restore(sv) { // rebuild a saved base on the fresh ground; anything that no longer fits is skipped, never thrown
  const B = bases[0]; use(B);
  state.stage = sv.stage || 1; state.goal = sv.goal || 0; state.made = sv.made || {}; state.speed = sv.speed || 1; state.real = sv.real || 0; state.sl.launched = !!sv.launched;
  for (const k of Object.keys(stock)) delete stock[k]; Object.assign(stock, sv.stock || {});
  B.elevator = sv.elevator || 0; B.coreLv = sv.coreLv != null ? sv.coreLv : B.coreLv; setArea(B); unlockSites();
  (sv.ports || []).forEach((it, k) => { if (B.core.ports[k]) B.core.ports[k].item = it; });
  for (const d of sv.blds || []) { try { if (!MACH[d.t]) continue; const b = putAt(d.t, d.x, d.y, d.r || 0, d.c || 0); b.item = d.i || null; b.route = d.o || null; if (d.p) b.pre = true; } catch (err) { console.warn('[base] restore: machine skipped', d, err); } }
  for (const q of sv.belts || []) if (q.length > 2) { try { makeLink(q[2], q[0], q[3]); } catch (err) { console.warn('[base] restore: link skipped', q, err); } }
  for (const q of sv.belts || []) if (q.length === 2) { const c = cells[q[0]]; if (c && passable(c)) c.belt = { dir: q[1], feeder: null, items: [], stuck: 0 }; }
  for (const i of sv.pipes || []) { const c = cells[i]; if (pipeable(c)) c.pipe = true; }
  for (const q of sv.jns || []) { const c = cells[q[0]]; if (!c || c.bld || c.jn || !MODEL[q[1]]) continue; const m = MODEL[q[1]](); m.position.set(wx(c), 0, wz(c)); m.rotation.y = ANG[q[2]]; G.jn.add(m); c.jn = { type: q[1], dir: q[2], item: q[3] || null, t: 0, rr: 0 }; Object.defineProperty(c.jn, 'mesh', { value: m }); }
  if (sv.berths && sv.berths.length) B.orbit.berths = sv.berths.map(o => Object.assign(newBerth(), o.ship ? { ship: o.ship, repeat: !!o.repeat } : {}));
  for (const k of FLEET_KEYS) state.fleet[k] = Math.max(0, Math.floor(Number((sv.fleet || {})[k]) || 0));

}
function reset(sl) {

  if (params.get('fast') === '1') CONFIG.time_scale.value *= 4; // test hook: four times the game speed
  for (const B of bases) if (B.G.group.parent) world.remove(B.G.group); bases.length = 0;

    stage: 1, goal: 0, made: {}, log: {}, padCount: {}, sites: DATA.sites.map(s => Object.assign({}, s, { built: s.stage <= 1, base: s.stage <= 1 ? 0 : -1 })), view: 0, otab: 0, berth: 0, shipPick: 'frigate',
    fleet: { frigate: 0, cruiser: 0, bombard: 0, scout: 0, support: 0, colony: 0 }, speed: 1, banner: null, msg: null, done: false, sl: { info: null, key: '', idle: 0, launched: false, launchT: -1, doneSent: false } };
  makeBase(0); // the home world's base: the only one in the slice
  show(bases[0]);
  if (demo) { state.phase = 'base'; state.landed = true; buildDemo(); } // check hook: ?demo=1
  else if (sl && sl.baseSave && sl.baseSave.blds) { try { restore(sl.baseSave); } catch (err) { console.warn('[base] restore failed, starting a fresh base', err); } }
  else seedBase();
  if (TOUCH && !demo) { const c0 = bases[0].cam; c0.dist = tune.touch_start_dist; c0.tz = tune.touch_start_tz; } // a phone opens closer, on the supply row and the free ground under it (the build bar covers the lower third); ?look= below still overrides
  if (tune.open_all) { const B0 = bases[0]; use(B0); state.stage = 3; B0.elevator = Math.max(B0.elevator, 3); unlockSites(); } // 全部開放: every state line, every supply route and the orbital shipyard from the first minute (an older save is opened up too)
  if (params.get('at') === 'base' || params.get('nofly') === '1') { state.phase = 'base'; state.landed = true; }
  if (params.get('look')) { const [lx, ly, lz] = params.get('look').split(',').map(Number); cur.cam.tx = lx - GW / 2; cur.cam.tz = ly - GH / 2; if (lz) cur.cam.dist = lz; } // check hook: where the camera looks
  if (params.get('phase')) { state.phase = params.get('phase'); state.landed = true; } // check hook: open on the orbit screen

}
const scenes = {
  play: {
    update(dt) {
      if (pressed('KeyP')) { scene = 'pause'; return; }
      if (pointer.taps.length || hit.size) state.sl.idle = 0; // any click or key: the player is busy, no idle hint
      if (state.landed) stepWorld(dt); else { state.t += dt; if (state.msg && (state.msg.t -= dt) <= 0) state.msg = null; }
      if (pointer.taps.length && state.phase !== 'fly') scenes.play.draw(); // a tap lands on what is on screen now, however long ago the last frame was
      if (state.phase === 'base') stepBase(dt); else if (state.phase === 'orbit') stepOrbit(); else stepFly(dt);
      if (state.phase !== 'base') { pointer.panx = pointer.pany = pointer.rot = pointer.wheel = 0; pointer.scale = 1; pointer.dragTo = null; }
    },
    draw() { if (state.phase === 'base') { updateItems(); updateGhost(); updateCards(); renderer.render(world, cam); drawHud(); } else if (state.phase === 'orbit') drawOrbit(); else drawFly(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || (TOUCH && pointer.taps.length)) scene = 'play'; if (TOUCH) { pointer.taps.length = 0; pointer.panx = pointer.pany = pointer.rot = pointer.wheel = 0; pointer.scale = 1; pointer.dragTo = null; } },
    draw() { scenes.play.draw(); ctx.fillStyle = 'rgba(4,8,16,0.6)'; ctx.fillRect(0, 0, W, H); text('暫停', W / 2, H / 2, 48, C.white, 'center', 'bold'); text(TOUCH ? '點一下畫面繼續' : 'P 繼續', W / 2, H / 2 + 50, TOUCH ? tune.touch_text : 18, C.mute); },
  },
};

// ---- Loop ------------------------------------------------------------------------------------
function step() { if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); } scenes[scene].update(STEP); hit.clear(); }
let last, acc = 0, ALPHA = 1;
function tick() { const now = clock.now(); acc += Math.min(now - last, 0.25); last = now; while (acc >= STEP) { step(); acc -= STEP; } ALPHA = acc / STEP; if (!BG) drawFrame(); }
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  get slice() { return state.sl; },
  launch() { launchFleet(); },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

// ---- Check hook (?demo=1): the main base already built across all three state lines, stock enough to finish in a minute ---------------

// ---- Start: the shell (or the address, standalone) hands over { seed, hull, ... } ---------------------------------------------------------
// One continuing game: the shell keeps this page loaded while the player is away exploring or fighting.
