// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

// ---- Slice: scenery along the way, HUD helpers, start-up ----------------------------------
const buttons = [];
function button(label, sub, x, y, w, h, id, on, color) { // a clickable HUD button (hit-tested in hitButton)

  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = on ? hexA(color, 0.8) : C.lineDim; ctx.lineWidth = on ? 1.5 : 1; ctx.stroke();

function hitButton(cx, cy, p) {

    else if (b.id === 'confirm') tryConfirm(p);

  }

}
function drawObjectiveChip() { // the "what now" chip, top centre in both views
  const o = goalInfo(); if (!o) return;

      ctx.fillStyle = 'rgba(8,16,30,0.72)'; ctx.fillRect(W / 2 - lw / 2 - 14, ly, lw + 28, fs + 10);

  text(`${o.step}/3`, x + 38, y + h / 2, 16, ACC, 'center', 'bold');
  ctx.fillStyle = C.lineDim; ctx.fillRect(x + 66, y + 10, 1, h - 20);
  text(o.text, x + 86, y + h / 2, 21, C.white, 'left', 'bold');
  ctx.restore();
  const lines = [o.hint, state.msg && state.msg.text].filter(Boolean);
  lines.forEach((s, i) => {

    ctx.fillStyle = 'rgba(8,16,30,0.62)'; ctx.fillRect(W / 2 - tw / 2 - 12, y + h + 6 + i * 26, tw + 24, 22);

}
// scenery: a ringed giant, an ice belt, a dead station and 灰脊's moon, with captions as you pass them
const landmarks = []; // { name, pos, size, range, at, title, sub, shown, obj, spin }
let sceneryBuilt = false;
const DUST_N = 260, DUST_BOX = 700, dustBase = new Float32Array(DUST_N * 3);
const dustGeo = new THREE.BufferGeometry();
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x9fd0ff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0.55, depthWrite: false }));
dust.frustumCulled = false;
function updateDust() { // motion cue: specks that wrap around the ship
  const a = dustGeo.attributes.position; if (!a) return;
  const P = [ship.pos.x, ship.pos.y, ship.pos.z];
  for (let i = 0; i < DUST_N; i++) for (let k = 0; k < 3; k++) {
    let v = dustBase[i * 3 + k] - P[k]; v = ((v % DUST_BOX) + DUST_BOX) % DUST_BOX - DUST_BOX / 2; a.array[i * 3 + k] = P[k] + v;
  }
  a.needsUpdate = true;
}
function buildScenery() {
  if (sceneryBuilt) return; sceneryBuilt = true;
  const r = mulberry(0x5eed), tp = planets[0].pos, D = tp.length();
  const flat = (c, rough = 0.9) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: rough, metalness: 0.1 });
  const add = (obj, o) => { space.add(obj); landmarks.push(Object.assign({ shown: false, obj, pos: obj.position, range: 0, size: 1 }, o)); };
  for (let i = 0; i < DUST_N * 3; i++) dustBase[i] = r() * DUST_BOX;
  dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DUST_N * 3), 3)); space.add(dust);
  { // 琉璃: a banded giant with two rings, ahead and to the left
    const G = new THREE.Group(), geo = new THREE.IcosahedronGeometry(1, 3), pa = geo.attributes.position, ca = new Float32Array(pa.count * 3);
    const c1 = new THREE.Color('#e3cfa6'), c2 = new THREE.Color('#7fa6b8'), c3 = new THREE.Color('#c98d6a'), c = new THREE.Color();
    for (let k = 0; k < pa.count; k++) {
      const band = 0.5 + 0.5 * Math.sin(pa.getY(k) * 11 + Math.sin(pa.getX(k) * 3) * 0.6);
      c.copy(c1).lerp(band > 0.5 ? c2 : c3, Math.abs(band - 0.5) * 1.6); ca[k * 3] = c.r; ca[k * 3 + 1] = c.g; ca[k * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(ca, 3));
    G.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 })));
    for (const [a, b, o, col] of [[1.4, 1.75, 0.55, '#d9c9a4'], [1.85, 2.25, 0.38, '#b9a98a']]) {
      const ringM = new THREE.Mesh(new THREE.RingGeometry(a, b, 72), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: o, side: THREE.DoubleSide, depthWrite: false }));
      ringM.rotation.x = Math.PI / 2; G.add(ringM);
    }
    G.rotation.set(0.35, 0, -0.28); G.scale.setScalar(800); G.position.set(-D * 0.69, D * 0.05, -D * 1.25);
    add(G, { key: 'liuli', name: '琉璃', size: 800 * 2.2, range: 12000, at: 0.08, title: '景色 · 琉璃', sub: '機首左前方 · 帶環的氣態巨行星' });
  }
  { // 碎冰帶: rocks drifting past the flight line
    const iceMat = new THREE.MeshStandardMaterial({ color: 0xbcd3e6, roughness: 0.55, metalness: 0.05 }); loadTexture('ground-rock.jpg', t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1); iceMat.map = t; iceMat.color.set(0xdcecff); iceMat.needsUpdate = true; });
    const spots = [];
    const n = 170, im = new THREE.InstancedMesh(lumpyRock(91), iceMat, n), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      const a = r() * Math.PI * 2, rad = 45 + r() * 300, s = 3 + r() * r() * 22;
      ps.set(Math.cos(a) * rad, Math.sin(a) * rad * 0.45, -D * (0.25 + r() * 0.2));
      e.set(r() * 6, r() * 6, r() * 6); q.setFromEuler(e); sc.set(s, s * (0.6 + r() * 0.5), s);
      m4.compose(ps, q, sc); im.setMatrixAt(i, m4); spots.push([ps.x, ps.y, ps.z, s]);
    }
    im.position.set(0, 0, 0); im.frustumCulled = false; space.add(im);
    { // painted rocks (rock-1..3.png) in place of the lumpy 3D ones, as soon as all three pictures are in: a card each, facing the ship
      const texs = []; let got = 0;
      for (let k = 0; k < 3; k++) loadTexture(`rock-${k + 1}.png`, t => {
        texs[k] = t; if (++got < 3) return;
        const cards = new THREE.Group(), mats = [];
        for (let j = 0; j < 12; j++) mats.push(new THREE.SpriteMaterial({ map: texs[j % 3], color: 0xdfeaf6, transparent: true, alphaTest: 0.05, rotation: (j >> 2) * 0.9 - 0.9, fog: false }));
        spots.forEach(([x, y, z, sz], i) => { const sp = new THREE.Sprite(mats[i % 12]), w = sz * tune.rock_card; sp.scale.set(i % 2 ? w : -w, w * texs[i % 3].image.height / texs[i % 3].image.width, 1); sp.position.set(x, y, z); cards.add(sp); });
        space.add(cards); im.visible = false;
      });
    }
    landmarks.push({ shown: false, obj: im, pos: new THREE.Vector3(0, 0, -D * 0.35), range: 0, size: 1, name: '碎冰帶', at: 0.27, title: '景色 · 碎冰帶', sub: '穿過冰塵，看碎片從窗邊掠過' });
  }
  { // 無名舊站: a spinning ring station, dark but for a few lamps
    const S = new THREE.Group(), metal = flat(0x8b97a8, 0.5), lamp = new THREE.MeshBasicMaterial({ color: 0xffc76a });
    S.add(new THREE.Mesh(new THREE.TorusGeometry(1, 0.09, 6, 28), metal));
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.9, 8), flat(0x5b6678)); hub.rotation.x = Math.PI / 2; S.add(hub);
    for (let i = 0; i < 4; i++) { const sp = new THREE.Mesh(new THREE.BoxGeometry(2, 0.05, 0.05), metal); sp.rotation.z = i * Math.PI / 4; S.add(sp); }
    for (let i = 0; i < 12; i++) { if (i % 3 === 1) continue; const l = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.07), lamp); const a = i / 12 * Math.PI * 2; l.position.set(Math.cos(a), Math.sin(a), 0.1); S.add(l); }
    S.scale.setScalar(70); S.position.set(-330, 90, -D * 0.6); S.rotation.set(0.5, 0.7, 0);
    add(S, { name: '無名舊站', size: 70, range: 2600, at: 0.5, title: '景色 · 無名舊站', sub: '左側 · 訊號早已沉寂的環形軌道站', spin: true });
    loadTexture('sta-old.png', t => { // the painted derelict (sta-old.png) as a card; the low-poly ring stays as the fallback
      for (const c of S.children) c.visible = false;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, alphaTest: 0.05, fog: false, color: 0xc9d2e0 })); sp.scale.set(tune.station_card, tune.station_card * t.image.height / t.image.width, 1); S.add(sp);
    });
  }
  { // the moon of 灰脊
    const M = PAINTED ? new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), new THREE.MeshStandardMaterial({ map: moonMap(), bumpMap: moonMap(), bumpScale: 3, roughness: 1 })) : new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), flat(0xb8b2aa, 1));
    M.scale.setScalar(36); M.position.copy(tp).add(new THREE.Vector3(560, 140, 260));
    add(M, { key: 'moon', name: `${TGT.name}的月`, size: 36, range: 2200, at: 0.66, title: `景色 · ${TGT.name}的月`, sub: '右前方 · 它只有這一顆衛星' });
  }
}
function stepVistas(dt) {
  if (!sceneryBuilt) return;
  for (const lm of landmarks) if (lm.spin) lm.obj.rotateZ(dt * 0.12);
  if (state.phase !== 'cruise' || state.banner) return;
  const tp = planets[0], prog = 1 - Math.min(1, tp.pos.distanceTo(ship.pos) / tp.pos.length());
  for (const lm of landmarks) {
    if (lm.shown || lm.at == null || prog < lm.at) continue;
    lm.shown = true; banner(lm.title, lm.sub, '#6fe3ff', 4); sfx.blip(); events.push({ type: 'vista', name: lm.name });
    break;
  }
}
function drawLandmarks() { // small diamond tags on the scenery that is in front of you
  for (const lm of landmarks) {
    if (!lm.range) continue;
    const d = lm.pos.distanceTo(ship.pos); if (d > lm.range || d < lm.size * 0.8) continue;
    const s = project(lm.pos, spaceCam); if (!s.front || s.x < 60 || s.x > W - 60 || s.y < 120 || s.y > 520) continue;
    const rr = Math.min(160, lm.size / d * (H / 2) / Math.tan(35 * Math.PI / 180)), a = Math.min(1, (lm.range - d) / (lm.range * 0.25));
    ctx.save(); ctx.globalAlpha = 0.85 * a; ctx.strokeStyle = C.line; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y - rr - 18); ctx.lineTo(s.x + 6, s.y - rr - 12); ctx.lineTo(s.x, s.y - rr - 6); ctx.lineTo(s.x - 6, s.y - rr - 12); ctx.closePath(); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = a; plateText(lm.name, s.x, s.y - rr - (TOUCH ? 38 : 32), TOUCH ? 22 : 14, C.line, 'bold'); ctx.globalAlpha = 1;
  }
}

SLICE.start('planet', S => {
  SL = S; HD = SLICE.hull; ACC = HD.accent; ACC_HEX = HD.accentHex;
  if (S.target && S.target.name) TGT = { name: String(S.target.name), type: TYPES[S.target.type] ? S.target.type : 'rocky', home: !!S.target.home };
  if (S.target && S.target.id !== 'liuli' && PLANET_DISC[S.target.id]) TGT_ID = S.target.id;
  SW = TGT.home ? '基地點' : '前哨點'; document.title = '星際 · ' + TGT.name;
  buildOrbitShip();
  reset();
  buildScenery();
  if (params.get('art') !== 'off') loadArt(); // pictures arrive when they arrive; the page never waits for them (?art=off: a check of the drawn look)
  scene = 'play';
  last = clock.now();
